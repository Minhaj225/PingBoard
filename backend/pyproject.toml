[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pingboard-api"
version = "0.1.0"
description = "PingBoard — multi-tenant uptime monitoring API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.1",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "pyjwt==2.15.1",
    "bcrypt==5.0.0",
    "httpx==0.28.1",
    "redis==5.3.1",  # arq 0.28 caps redis<6; revisit with the Phase 3 job-runner choice
    "arq==0.28.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.9",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "anyio==4.15.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B008"]
"alembic/*" = ["I", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["alembic.*", "arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
