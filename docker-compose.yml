name: pingboard

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pingboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pingboard}
      POSTGRES_DB: ${POSTGRES_DB:-pingboard}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pingboard} -d ${POSTGRES_DB:-pingboard}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      args:
        # Match the host user so bind-mounted source stays writable in dev.
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pingboard}:${POSTGRES_PASSWORD:-pingboard}@db:5432/${POSTGRES_DB:-pingboard}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Hot reload in dev. Remove this mount for a production-shaped run.
      # `:z` relabels for SELinux hosts (Fedora/RHEL); a no-op elsewhere.
      - ./backend:/app:z
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    command: ["arq", "app.workers.main.WorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pingboard}:${POSTGRES_PASSWORD:-pingboard}@db:5432/${POSTGRES_DB:-pingboard}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app:z
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Migrations run in the api service; don't start checking against a
      # schema that isn't there yet.
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      target: dev
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    command: ["npm", "run", "dev"]
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_USE_POLLING: "true"
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app:z
      # Keep the image's node_modules; don't let the host mount shadow it.
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
