name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pyproject.toml --extra-group dev

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run mypy strict type check
        run: mypy app

  backend-tests:
    name: Backend Tests (Unit + Integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pingboard
          POSTGRES_PASSWORD: pingboard
          POSTGRES_DB: pingboard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pingboard -d pingboard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pyproject.toml --extra-group dev

      - name: Run pytest with PostgreSQL and Redis
        env:
          DATABASE_URL: postgresql+asyncpingboard://pingboard:pingboard@postgres:5433/pingboard_test
          REDIS_URL: redis://redis:6379/0
        run: |
          pytest

  frontend-checks-tests:
    name: Frontend Lint, Typecheck and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run vitest tests
        run: npm run test

      - name: Run build
        run: npm run build

  docker-build-check:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -t pingboard-api:latest ./backend

      - name: Build Worker image
        run: docker build -t pingboard-worker:latest ./backend

      - name: Build Web image
        run: docker build -t pingboard-web:latest ./frontend